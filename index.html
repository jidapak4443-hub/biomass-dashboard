<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{font-family:'Mitr',sans-serif;background:#F4F7F4;padding:20px;color:#2C3E35;}
  .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.05);margin-bottom:15px;}
  table{width:100%;border-collapse:collapse;}
  th, td{padding:10px;border-bottom:1px solid #ddd;text-align:left;}
  th.num, td.num{text-align:right;}
</style>
</head>
<body>
<div class="card">
  <h2>🧪 โหมดทดสอบระบบ (จำลองข้อมูล)</h2>
  <div id="plantTabs" style="margin-bottom:15px;"></div>
  <table>
    <thead>
      <tr>
        <th>ชื่อผู้จัดจำหน่าย</th>
        <th class="num">น้ำหนัก (Ton)</th>
        <th class="num">Net CV</th>
        <th class="num">ราคา/ตัน</th>
        <th class="num">Baht/MJ</th>
      </tr>
    </thead>
    <tbody id="vendorTableBody"></tbody>
  </table>
</div>

<script>
// ข้อมูลจำลองเพื่อเช็คว่าหน้าเว็บแสดงผลปกติไหม
const mockData = {
  "โรงไฟฟ้า A": {
    "แกลบ": [
      { name: "บริษัท สมชาย ชีวมวล จำกัด", ton: 1200, netCv: 3200, price: 950 },
      { name: "สหกรณ์เกษตรกรไทย", ton: 850, netCv: 3100, price: 920 }
    ]
  }
};

function initTest() {
  const tbody = document.getElementById('vendorTableBody');
  tbody.innerHTML = '';
  
  mockData["โรงไฟฟ้า A"]["แกลบ"].forEach(v => {
    let bahtMj = (v.price / v.netCv).toFixed(4);
    let row = document.createElement('tr');
    row.innerHTML = `
      <td><strong>${v.name}</strong></td>
      <td class="num">${v.ton.toLocaleString()}</td>
      <td class="num">${v.netCv.toLocaleString()}</td>
      <td class="num">${v.price.toLocaleString()}</td>
      <td class="num" style="font-weight:700;color:#2F9E52;">${bahtMj}</td>
    `;
    tbody.appendChild(row);
  });
  document.getElementById('plantTabs').innerHTML = '<button style="padding:8px 16px;background:#4A8B56;color:#fff;border:none;border-radius:8px;">⚡ โรงไฟฟ้า A (ทดสอบ)</button>';
}

initTest();
</script>
</body>
</html>
