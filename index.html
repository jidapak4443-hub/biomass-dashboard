<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Quality Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #F5F9F6;
    --card: #FFFFFF;
    --primary: #4A7C59;
    --primary-light: #EBF3ED;
    --text: #2C3E35;
    --muted: #7E8F84;
    --border: #D8E4DC;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(74, 124, 89, 0.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Mitr', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .wrap { max-width: 1400px; margin: 0 auto; }

  /* Header สไตล์พรีเมียม */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    padding: 16px 24px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .brand-title { display: flex; align-items: baseline; gap: 12px; }
  .brand-title h1 { margin: 0; font-size: 22px; color: var(--text); font-weight: 600; }
  .brand-title h1 span { color: var(--primary); }
  .brand-title p { margin: 0; font-size: 13px; color: var(--muted); border-left: 2px solid var(--border); padding-left: 12px; }
  
  .update-badge {
    background: #F0F4F1;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }
  .update-badge b { color: var(--text); display: block; font-size: 13px; }

  /* Filter Bar แถบบนสุด */
  .filter-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    background: var(--card);
    padding: 14px 18px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #FAFCFB;
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .filter-item select, .filter-item input {
    border: none;
    background: transparent;
    font-family: 'Mitr', sans-serif;
    font-size: 13px;
    color: var(--text);
    width: 100%;
    outline: none;
  }

  /* Main Layout: ซ้าย Card สรุป / ขวา ตารางหลัก */
  .main-grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
  }
  @media(max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

  /* Left Cards สรุปค่าเฉลี่ย */
  .left-cards { display: flex; flex-direction: column; gap: 12px; }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--primary);
  }
  .stat-card h4 { margin: 0 0 6px 0; font-size: 13px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 26px; font-weight: 600; color: var(--text); }
  .stat-value span { font-size: 15px; font-weight: 500; color: var(--muted); }

  /* Right Table Card */
  .table-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .table-card h3 { margin: 0 0 14px 0; font-size: 16px; color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 12px 10px; color: var(--muted); font-weight: 500; border-bottom: 2px solid var(--border); background: #FAFCFB; white-space: nowrap; }
  th.num, td.num { text-align: right; }
  td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  
  tr.group-header td { background: #F8FBF9; font-weight: 600; color: var(--primary); border-top: 1px solid var(--border); }
  tr.sub-total td { background: #FAFCFB; font-weight: 600; color: var(--text); border-bottom: 2px solid var(--border); }
  
  /* Baht/MJ Highlight status */
  .badge-green { background: #E2F0D9; color: #385723; padding: 4px 10px; border-radius: 6px; font-weight: 600; display: inline-block; text-align: right; }
  .badge-red { background: #FCE4D6; color: #C65911; padding: 4px 10px; border-radius: 6px; font-weight: 600; display: inline-block; text-align: right; }
</style>
</head>
<body>
<div class="wrap">
  
  <!-- Header -->
  <div class="top-header">
    <div class="brand-title">
      <h1>Fuel Quality <span>Dashboard</span></h1>
      <p>อัปเดตคุณภาพเชื้อเพลิงโรงไฟฟ้า (รายวัน) <span id="dateRangeInfo"></span></p>
    </div>
    <div class="update-badge">
      อัปเดตล่าสุด
      <b id="lastUpdateTime">-</b>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-item">
      <span>🏭</span>
      <select id="filterPlant" onchange="applyFilters()"><option value="">โรงไฟฟ้าทั้งหมด</option></select>
    </div>
    <div class="filter-item">
      <span>🪵</span>
      <select id="filterFuel" onchange="applyFilters()"><option value="">สินค้าทั้งหมด</option></select>
    </div>
    <div class="filter-item">
      <span>🚛</span>
      <select id="filterLogistic" onchange="applyFilters()"><option value="">Logistic ทั้งหมด</option></select>
    </div>
    <div class="filter-item">
      <span>👥</span>
      <input type="text" id="filterCustomer" placeholder="ค้นหาชื่อลูกค้า..." oninput="applyFilters()">
    </div>
    <div class="filter-item">
      <span>📅</span>
      <input type="date" id="startDate" onchange="applyFilters()" style="width:45%"> - 
      <input type="date" id="endDate" onchange="applyFilters()" style="width:45%">
    </div>
  </div>

  <!-- Main Content Grid -->
  <div class="main-grid">
    
    <!-- Left Stats -->
    <div class="left-cards">
      <div class="stat-card">
        <h4>💧 ความชื้นเฉลี่ย (%TM)</h4>
        <div class="stat-value" id="avgMoisture">0.00 <span>%</span></div>
      </div>
      <div class="stat-card">
        <h4>🪙 Baht/MJ เฉลี่ย</h4>
        <div class="stat-value" id="avgBahtMj">0.000</div>
      </div>
      <div class="stat-card">
        <h4>🌋 ขี้เถ้าเฉลี่ย (%Ash)</h4>
        <div class="stat-value" id="avgAsh">0.00 <span>%</span></div>
      </div>
      <!-- ตัวการ์ตูนตกแต่งน่ารักๆ มินิมอล -->
      <div style="text-align:center; padding:15px; background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow);">
        <span style="font-size:36px;">🌱🦊⚡</span>
        <p style="margin:6px 0 0 0; font-size:12px; color:var(--muted);">Biomass Smart Analytics</p>
      </div>
    </div>

    <!-- Right Table -->
    <div class="table-card">
      <h3>📋 คุณภาพเชื้อเพลิง</h3>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>กลุ่มชพ.</th>
              <th>ชื่อลูกค้า</th>
              <th class="num">Ton</th>
              <th class="num">%TM by weight</th>
              <th class="num">Ash</th>
              <th class="num">ฝุ่นแกลบ</th>
              <th class="num">Baht/MJ act</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data will be injected here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
let globalRawData = [];

async function loadData() {
  try {
    let response = await fetch('./data.json?v=' + new Date().getTime());
    globalRawData = await response.json();
    
    // แสดงเวลาปัจจุบันที่โหลด
    let now = new Date();
    document.getElementById('lastUpdateTime').textContent = now.toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'}) + ' ' + now.toLocaleTimeString();

    populateDropdowns();
    applyFilters();
  } catch (error) {
    console.error("Error loading data:", error);
  }
}

function populateDropdowns() {
  let plants = new Set();
  let fuels = new Set();
  let logistics = new Set();

  globalRawData.forEach(row => {
    let keys = Object.keys(row);
    let getVal = (kws) => {
      let found = keys.find(k => kws.some(kw => k.trim().toLowerCase().includes(kw.toLowerCase())));
      return found ? row[found] : '';
    };

    let p = String(getVal(['โรงไฟฟ้า', 'Plant'])).trim();
    let f = String(getVal(['สินค้า', 'Fuel', 'Type'])).trim();
    let l = String(getVal(['Logistic', 'ขนส่ง', 'รถ'])).trim();
    
    if(p) plants.add(p);
    if(f) fuels.add(f);
    if(l) logistics.add(l);
  });

  let fillSelect = (id, setVal) => {
    let sel = document.getElementById(id);
    setVal.forEach(val => {
      let opt = document.createElement('option');
      opt.value = val; opt.textContent = val;
      sel.appendChild(opt);
    });
  };

  fillSelect('filterPlant', plants);
  fillSelect('filterFuel', fuels);
  fillSelect('filterLogistic', logistics);
}

function applyFilters() {
  let selPlant = document.getElementById('filterPlant').value;
  let selFuel = document.getElementById('filterFuel').value;
  let selLogistic = document.getElementById('filterLogistic').value;
  let searchCust = document.getElementById('filterCustomer').value.toLowerCase();
  let startDate = document.getElementById('startDate').value;
  let endDate = document.getElementById('endDate').value;

  let filtered = [];

  globalRawData.forEach(row => {
    let keys = Object.keys(row);
    let getVal = (kws) => {
      let found = keys.find(k => kws.some(kw => k.trim().toLowerCase().includes(kw.toLowerCase())));
      return found ? row[found] : '';
    };

    let plant = String(getVal(['โรงไฟฟ้า', 'Plant']) || '').trim();
    let fuel = String(getVal(['สินค้า', 'Fuel', 'Type']) || 'ไม่ระบุสินค้า').trim();
    let name = String(getVal(['ชื่อลูกค้า', 'Vendor', 'Customer', 'Name']) || '').trim();
    let logistic = String(getVal(['Logistic', 'ขนส่ง'])).trim();
    let dateStr = String(getVal(['วันที่ชั่งออก', 'วันที่ชั่ง', 'Date', 'วันที่'])).trim();

    if (selPlant && plant !== selPlant) return;
    if (selFuel && fuel !== selFuel) return;
    if (selLogistic && logistic !== selLogistic) return;
    if (searchCust && !name.toLowerCase().includes(searchCust)) return;
    if (startDate && dateStr && dateStr < startDate) return;
    if (endDate && dateStr && dateStr > endDate) return;

    let netCv = parseFloat(getVal(['Net CV', 'kcal'])) || 0;
    let price = parseFloat(getVal(['Price', 'ราคา'])) || 0;
    let moisture = parseFloat(getVal(['%TM', 'ความชื้น', 'Moisture'])) || 0;
    let ash = parseFloat(getVal(['%Ash', 'Ash', 'เถ้า'])) || 0;
    let dust = parseFloat(getVal(['ฝุ่นแกลบ', 'Dust'])) || 0;
    let ton = parseFloat(getVal(['นน.สุทธิ', 'Ton', 'Weight', 'Net'])) || 0;

    if (!name) return;

    filtered.push({
      fuel, name, ton, moisture, ash, dust,
      bahtMj: netCv > 0 ? parseFloat((price / netCv).toFixed(3)) : 0
    });
  });

  renderDashboard(filtered);
}

function renderDashboard(data) {
  let tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted);">🌱 ไม่พบข้อมูลตามเงื่อนไขที่เลือก</td></tr>`;
    document.getElementById('avgMoisture').innerHTML = `0.00 <span>%</span>`;
    document.getElementById('avgBahtMj').textContent = `0.000`;
    document.getElementById('avgAsh').innerHTML = `0.00 <span>%</span>`;
    return;
  }

  // จัดกลุ่มตามสินค้า (Fuel Grouping)
  let groups = {};
  data.forEach(item => {
    if (!groups[item.fuel]) groups[item.fuel] = [];
    groups[item.fuel].push(item);
  });

  let totalTonAll = 0, sumMoistureAll = 0, sumBahtAll = 0, sumAshAll = 0, countAll = 0;

  Object.keys(groups).forEach(fuelName => {
    let items = groups[fuelName];
    let groupTon = items.reduce((sum, i) => sum + i.ton, 0);
    let groupMoisture = items.reduce((sum, i) => sum + i.moisture, 0) / items.length;
    let groupAsh = items.reduce((sum, i) => sum + i.ash, 0) / items.length;
    let groupDust = items.reduce((sum, i) => sum + i.dust, 0) / items.length;
    let groupBaht = items.reduce((sum, i) => sum + i.bahtMj, 0) / items.length;

    totalTonAll += groupTon;
    sumMoistureAll += groupMoisture;
    sumBahtAll += groupBaht;
    sumAshAll += groupAsh;
    countAll++;

    // พิมพ์รายการลูกค้าย่อย
    items.forEach((item, idx) => {
      let badgeClass = item.bahtMj > 0.150 ? 'badge-red' : 'badge-green'; // เกณฑ์สีเตือน
      let row = document.createElement('tr');
      row.innerHTML = `
        <td>${idx === 0 ? '<b>' + fuelName + '</b>' : ''}</td>
        <td>${item.name}</td>
        <td class="num">${item.ton.toLocaleString()}</td>
        <td class="num">${item.moisture.toFixed(2)}</td>
        <td class="num">${item.ash.toFixed(2)}</td>
        <td class="num">${item.dust.toFixed(2)}</td>
        <td class="num"><span class="${badgeClass}">${item.bahtMj.toFixed(3)}</span></td>
      `;
      tbody.appendChild(row);
    });

    // แถวสรุป (รวม) ประจำกลุ่มสินค้า
    let subRow = document.createElement('tr');
    subRow.className = 'sub-total';
    subRow.innerHTML = `
      <td>รวม</td>
      <td>-</td>
      <td class="num">${groupTon.toLocaleString()}</td>
      <td class="num">${groupMoisture.toFixed(2)}</td>
      <td class="num">${groupAsh.toFixed(2)}</td>
      <td class="num">${groupDust.toFixed(2)}</td>
      <td class="num">${groupBaht.toFixed(3)}</td>
    `;
    tbody.appendChild(subRow);
  });

  // อัปเดต Card ด้านซ้าย
  if (countAll > 0) {
    document.getElementById('avgMoisture').innerHTML = `${(sumMoistureAll / countAll).toFixed(2)} <span>%</span>`;
    document.getElementById('avgBahtMj').textContent = (sumBahtAll / countAll).toFixed(3);
    document.getElementById('avgAsh').innerHTML = `${(sumAshAll / countAll).toFixed(2)} <span>%</span>`;
  }
}

loadData();
</script>
</body>
</html>
