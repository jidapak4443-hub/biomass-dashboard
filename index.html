<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biomass Strategic Command Center & AI Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#F4F7F4; --card:#FFFFFF; --primary:#6AAE78; --primary-dark:#4A8B56;
    --text:#2C3E35; --muted:#7E8F84; --border:#D8E2D6;
    --green-bg:#E7F6EA; --green-text:#2F9E52;
    --radius:16px; --shadow:0 4px 20px rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Mitr',sans-serif;background:var(--bg);color:var(--text);padding:16px;}
  .wrap{max-width:1350px;margin:0 auto;}
  .ai-advisor-strip{background:linear-gradient(135deg, #1B3B2B, #2C5E43);color:white;border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow);border-left:6px solid #48BB78;}
  .ai-header{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#9AE6B4;margin-bottom:8px;}
  .ai-body{font-size:14px;line-height:1.5;color:#E2E8F0;}
  .filter-bar{display:flex;flex-wrap:wrap;gap:12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px;align-items:center;}
  .filter-bar label{font-size:13px;color:var(--muted);margin-right:4px;}
  .filter-bar input, .filter-bar select{padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:'Mitr',sans-serif;font-size:13px;}
  .btn{border:none;padding:8px 16px;border-radius:10px;font-family:'Mitr',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:.2s;}
  .btn-primary{background:var(--primary-dark);color:white;}
  .btn-ghost{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
  .grid-analytics{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:16px;}
  @media(max-width:900px){.grid-analytics{grid-template-columns:1fr;}}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
  .card h3{margin:0 0 12px;font-size:14px;color:var(--primary-dark);display:flex;align-items:center;gap:6px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:10px;color:var(--muted);font-weight:500;border-bottom:2px solid var(--border);white-space:nowrap;}
  th.num, td.num{text-align:right;}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr.vendor-row:hover{background:rgba(106,170,120,0.08);}
  .tier-badge{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .tier-a{background:#E7F6EA;color:#2F9E52;border:1px solid #2F9E52;}
  .tier-b{background:#EBF3FD;color:#2B6CB0;border:1px solid #2B6CB0;}
  .tier-c{background:#FFF6DC;color:#C9972A;border:1px solid #C9972A;}
  .tier-d{background:#FDEAEA;color:#D9534F;border:1px solid #D9534F;}
  .chart-container{position:relative;height:260px;width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <div class="ai-advisor-strip">
    <div class="ai-header">🤖 AI Biomass Procurement Advisor: ข้อเสนอแนะเชิงกลยุทธ์</div>
    <div class="ai-body"><span id="aiRecommendationText">💡 กำลังประมวลผลข้อมูล...</span></div>
  </div>

  <!-- แถบตัวกรอง (Filter Bar) -->
  <div class="filter-bar">
    <div><label>⚡ โรงไฟฟ้า:</label><select id="filterPlant" onchange="applyFilters()"><option value="">-- ทุกโรงไฟฟ้า --</option></select></div>
    <div><label>🪵 สินค้า:</label><select id="filterFuel" onchange="applyFilters()"><option value="">-- ทุกสินค้า --</option></select></div>
    <div><label>📅 ตั้งแต่:</label><input type="date" id="startDate"></div>
    <div><label>ถึง:</label><input type="date" id="endDate"></div>
    <div><label>🔍 ลูกค้า:</label><input type="text" id="filterCustomer" placeholder="พิมพ์ชื่อลูกค้า..." oninput="applyFilters()" style="width:130px;"></div>
    <button class="btn btn-primary" onclick="applyFilters()">🔍 กรองข้อมูล</button>
    <button class="btn btn-ghost" onclick="resetFilter()">↺ รีเซ็ต</button>
  </div>

  <div class="grid-analytics">
    <div class="card">
      <h3>📈 เปรียบเทียบต้นทุน Baht/MJ</h3>
      <div class="chart-container"><canvas id="barChart"></canvas></div>
    </div>
    <div class="card">
      <h3>⚠️ Smart Alert & สรุปสถานะ</h3>
      <div id="alertBox" style="font-size:13px;display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px;">📋 รายงานการจัดซื้อและคุณภาพเชื้อเพลิง (Vendor Evaluation)</h3>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th style="width:50px;">เกรด</th>
            <th>ชื่อลูกค้า / ผู้จัดจำหน่าย</th>
            <th class="num">น้ำหนักรวม (Ton)</th>
            <th class="num">ความชื้น (%)</th>
            <th class="num">%Ash</th>
            <th class="num">ฝุ่นแกลบ</th>
            <th class="num">ราคา/ตัน</th>
            <th class="num">Baht/MJ</th>
          </tr>
        </thead>
        <tbody id="vendorTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let globalRawData = [];
let chartInstance = null;

async function loadData() {
  try {
    let response = await fetch('./data.json?v=' + new Date().getTime());
    globalRawData = await response.json();
    
    populateDropdowns();
    applyFilters();
  } catch (error) {
    console.error("Error:", error);
    document.getElementById('aiRecommendationText').innerHTML = "⚠️ โหลดไฟล์ data.json ไม่สำเร็จ";
  }
}

function populateDropdowns() {
  let plants = new Set();
  let fuels = new Set();

  globalRawData.forEach(row => {
    let keys = Object.keys(row);
    let getVal = (kws) => {
      let found = keys.find(k => kws.some(kw => k.trim().toLowerCase().includes(kw.toLowerCase())));
      return found ? row[found] : '';
    };

    let p = String(getVal(['โรงไฟฟ้า', 'Plant'])).trim();
    let f = String(getVal(['สินค้า', 'Fuel', 'Type'])).trim();
    if(p) plants.add(p);
    if(f) fuels.add(f);
  });

  let plantSelect = document.getElementById('filterPlant');
  plants.forEach(p => {
    let opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    plantSelect.appendChild(opt);
  });

  let fuelSelect = document.getElementById('filterFuel');
  fuels.forEach(f => {
    let opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    fuelSelect.appendChild(opt);
  });
}

function applyFilters() {
  let selPlant = document.getElementById('filterPlant').value;
  let selFuel = document.getElementById('filterFuel').value;
  let searchCust = document.getElementById('filterCustomer').value.toLowerCase();
  let startDate = document.getElementById('startDate').value;
  let endDate = document.getElementById('endDate').value;

  let grouped = {};

  globalRawData.forEach(row => {
    let keys = Object.keys(row);
    let getVal = (kws) => {
      let found = keys.find(k => kws.some(kw => k.trim().toLowerCase().includes(kw.toLowerCase())));
      return found ? row[found] : '';
    };

    let plant = String(getVal(['โรงไฟฟ้า', 'Plant']) || 'โรงไฟฟ้าหลัก').trim();
    let fuel = String(getVal(['สินค้า', 'Fuel', 'Type']) || 'รวมเชื้อเพลิง').trim();
    let name = String(getVal(['ชื่อลูกค้า', 'Vendor', 'Customer', 'Name']) || 'ไม่ระบุชื่อ').trim();
    let dateStr = String(getVal(['วันที่', 'Date'])).trim();

    // เงื่อนไขกรอง
    if (selPlant && plant !== selPlant) return;
    if (selFuel && fuel !== selFuel) return;
    if (searchCust && !name.toLowerCase().includes(searchCust)) return;
    if (startDate && dateStr && dateStr < startDate) return;
    if (endDate && dateStr && dateStr > endDate) return;

    let netCv = parseFloat(getVal(['Net CV', 'kcal'])) || 0;
    let price = parseFloat(getVal(['Price', 'ราคา'])) || 0;
    let moisture = parseFloat(getVal(['%TM', 'ความชื้น', 'Moisture'])) || 0;
    let ash = parseFloat(getVal(['%Ash', 'Ash', 'เถ้า'])) || 0;
    let dust = parseFloat(getVal(['ฝุ่นแกลบ', 'Dust'])) || 0;
    let ton = parseFloat(getVal(['นน.สุทธิ', 'Ton', 'Weight', 'Net'])) || 0;

    if (!name) return;

    let key = plant + "_" + fuel + "_" + name;
    if (!grouped[key]) {
      grouped[key] = { plant, fuel, name, totalTon: 0, sumMoisture: 0, sumAsh: 0, sumDust: 0, sumNetCv: 0, sumPrice: 0, count: 0 };
    }

    let g = grouped[key];
    g.totalTon += ton;
    g.sumMoisture += moisture;
    g.sumAsh += ash;
    g.sumDust += dust;
    g.sumNetCv += netCv;
    g.sumPrice += price;
    g.count += 1;
  });

  let vendors = Object.values(grouped).map(item => {
    let cnt = item.count;
    let avgNetCv = cnt > 0 ? item.sumNetCv / cnt : 0;
    let avgPrice = cnt > 0 ? item.sumPrice / cnt : 0;
    let bahtMj = avgNetCv > 0 ? parseFloat((avgPrice / avgNetCv).toFixed(4)) : 0;

    return {
      plant: item.plant,
      fuel: item.fuel,
      name: item.name,
      ton: item.totalTon,
      moisture: cnt > 0 ? (item.sumMoisture / cnt).toFixed(2) : 0,
      ash: cnt > 0 ? (item.sumAsh / cnt).toFixed(2) : 0,
      dust: cnt > 0 ? (item.sumDust / cnt).toFixed(2) : 0,
      price: Math.round(avgPrice),
      bahtMj: bahtMj,
      tier: 'B'
    };
  });

  renderTableAndChart(vendors);
}

function renderTableAndChart(vendors) {
  const tbody = document.getElementById('vendorTableBody');
  tbody.innerHTML = '';

  if(vendors.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">ไม่พบข้อมูลตามเงื่อนไขที่กรอง</td></tr>`;
    document.getElementById('alertBox').innerHTML = `<div style="color:var(--muted);text-align:center;">ไม่มีข้อมูล</div>`;
    document.getElementById('aiRecommendationText').innerHTML = `💡 ไม่พบข้อมูลที่ตรงกับตัวกรอง ลองเปลี่ยนเงื่อนไขการค้นหา`;
    if(chartInstance) chartInstance.destroy();
    return;
  }

  vendors.sort((a,b) => a.bahtMj - b.bahtMj);
  let totalB = vendors.reduce((sum, v) => sum + v.bahtMj, 0);
  let avgBahtMj = totalB / vendors.length;

  vendors.forEach((v, index) => {
    if(index === 0) v.tier = 'A';
    else if(v.bahtMj <= avgBahtMj * 1.05) v.tier = 'B';
    else if(v.bahtMj <= avgBahtMj * 1.15) v.tier = 'C';
    else v.tier = 'D';

    let row = document.createElement('tr');
    row.className = 'vendor-row';
    row.innerHTML = `
      <td><span class="tier-badge tier-${v.tier.toLowerCase()}">${v.tier}</span></td>
      <td><strong>${v.name}</strong> <span style="font-size:11px;color:var(--muted);">(${v.plant} / ${v.fuel})</span></td>
      <td class="num">${v.ton.toLocaleString()}</td>
      <td class="num">${v.moisture}%</td>
      <td class="num">${v.ash}%</td>
      <td class="num">${v.dust}</td>
      <td class="num">${v.price.toLocaleString()}</td>
      <td class="num" style="font-weight:700;color:var(--primary-dark);">${v.bahtMj}</td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById('aiRecommendationText').innerHTML = `💡 ผู้จัดจำหน่ายที่คุ้มค่าที่สุดภายใต้เงื่อนไขนี้คือ <b>${vendors[0].name}</b> (${vendors[0].plant}) ด้วยต้นทุนพลังงานต่ำสุดที่ <b>${vendors[0].bahtMj} Baht/MJ</b>`;
  document.getElementById('alertBox').innerHTML = `<div style="background:var(--green-bg);color:var(--green-text);padding:10px 14px;border-radius:8px;">✅ กรองและประมวลผลสำเร็จ ${vendors.length} รายการ</div>`;

  renderChart(vendors);
}

function renderChart(vendors) {
  const ctx = document.getElementById('barChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();

  let topVendors = vendors.slice(0, 10); // แสดงสูงสุด 10 อันดับแรกในกราฟ

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: topVendors.map(v => v.name),
      datasets: [{
        label: 'Baht/MJ',
        data: topVendors.map(v => v.bahtMj),
        backgroundColor: '#4A8B56',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: '#E2E8F0' } },
        x: { grid: { display: false }, ticks: { font: { size: 11 } } }
      }
    }
  });
}

function resetFilter() {
  document.getElementById('filterPlant').value = '';
  document.getElementById('filterFuel').value = '';
  document.getElementById('filterCustomer').value = '';
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  applyFilters();
}

loadData();
</script>
</body>
</html>
