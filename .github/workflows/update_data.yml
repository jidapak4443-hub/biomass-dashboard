   name: Auto-Update Biomass Data

   on:
     schedule:
       - cron: '0 0 * * *' # รันอัตโนมัติทุกวันเวลาเที่ยงคืน UTC
     workflow_dispatch: # อนุญาตให้กดรันมือผ่านหน้าเว็บ GitHub ได้

   jobs:
     update-data:
       runs-on: ubuntu-latest
       permissions:
         contents: write # ให้สิทธิ์สคริปต์เขียนไฟล์ทับลง repository ได้
       steps:
         - name: Checkout repository
           uses: actions/checkout@v3

         - name: Set up Python
           uses: setup-python@v4
           with:
             python-version: '3.10'

         - name: Run script to fetch data
           run: python fetch_sheet.py

         - name: Commit and push if data changed
           uses: stefanzweifel/git-auto-commit-action@v4
           with:
             commit_message: "Auto-update biomass data from Google Sheet"
             file_pattern: data.json
